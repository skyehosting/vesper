# Publishes a Vesper release when a version tag is pushed (07 H-v12-updates). `npm run release 1.2.0` bumps the
# version, commits "Vesper 1.2.0", tags v1.2.0 and pushes both. This workflow then tests, builds the installer and the
# portable exe, and publishes them (with latest.yml and the installer's .blockmap) as a GitHub Release; installed
# copies of Vesper find it through latest.yml.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: The tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})."
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Release build (no test hooks)
        env:
          VESPER_BUILD_TEST: '0'
        run: npx electron-vite build

      - name: Package and publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
