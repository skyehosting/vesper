appId: com.vesper.app
productName: Vesper
copyright: Copyright © 2026 Vesper
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
  # Unit-test worker bundles and the release-build check's output never ship.
  - '!out/test-workers/**'
  - '!out/release-check/**'
asar: true
electronLanguages:
  - en-US
asarUnpack:
  # Native speech engine (N-API addon + onnxruntime DLLs) must live outside the asar.
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-win-x64/**
extraResources:
  # resources/ → <install>/resources/resources: wintts.ps1 (Windows voices host, 07 S2), sysstate.ps1 (game-mode host,
  # 07 D3), models/silero_vad.onnx, licenses/models.json. A unit test checks these files are present and covered.
  - from: resources
    to: resources
  # 07 B14 / F74: run by the NSIS uninstaller (build/installer.nsh); generated from src/server/net/uninstall.ts.
  - from: build/uninstall-cleanup.ps1
    to: uninstall-cleanup.ps1
extraFiles:
  # 07 E7: generated by scripts/licenses.mjs during `electron-vite build`; shipped next to Vesper.exe.
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
npmRebuild: false
# Auto-updates (07 H-v12-updates): `electron-builder --publish always` (.github/workflows/release.yml, on a v*.*.* tag)
# uploads the installer, its .blockmap, latest.yml and the portable exe to the draft GitHub Release the workflow created
# first; the workflow publishes it when all four are in.
# owner/repo come from package.json "repository" (https://github.com/skyehosting/vesper.git): releases are published
# there and installed copies check there (src/shared/updater.logic.ts).
publish:
  provider: github
  releaseType: draft
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vesper
  # customUnInstall: removes Vesper's Tailscale mapping and its "Vesper (LAN)" firewall rule (never on update).
  include: build/installer.nsh

  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
  unpackDirName: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
